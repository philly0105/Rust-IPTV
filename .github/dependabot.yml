# Weekly dependency updates. Updates that should not break the build arrive grouped, one pull
# request per ecosystem; the rest come one by one. Dependabot calls 0.37 -> 0.41 a minor update,
# but for a 0.x crate or package that is a breaking release, so the groups leave those out: npm
# groups minor and patch except its 0.x packages, cargo groups patch updates only (most direct
# Rust dependencies are 0.x). GitHub's "Dependabot security updates" (repository settings) add
# pull requests for advisories on top of this.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
        # 0.x in package.json: a minor update can break them.
        exclude-patterns:
          - tsc-rs
    ignore:
      # Patched through patches/ (package.json pnpm.patchedDependencies). Update the patch with it.
      - dependency-name: mpegts.js
      # `tauri build` stops when the npm and Rust Tauri packages are on different minor versions,
      # and Dependabot updates npm and cargo in separate pull requests. Move Tauri by hand, both
      # sides at once; patch releases still come through.
      - dependency-name: '@tauri-apps/*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-patch:
        update-types:
          - patch
    ignore:
      # See the npm entry above.
      - dependency-name: 'tauri*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
