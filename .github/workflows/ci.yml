# The same checks as `pnpm check`, plus the production build and its entry-chunk budget.
# The desktop crate (iptv-tauri) only builds on Windows, so the full Rust pass runs there; Linux
# tests the crates that do not depend on Tauri. No secrets are used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  frontend:
    name: Frontend (typecheck, test, build, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm comes from corepack, at the version package.json pins (packageManager).
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size:check

  rust-windows:
    name: Rust on Windows (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs build.frontendDist (../../dist) to exist. The Rust checks
      # do not need the real UI, so a placeholder page stands in for `pnpm build`.
      - name: Placeholder frontend for iptv-tauri
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>Tsrust IPTV</title>' > dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-linux:
    name: Rust on Linux (core, server, mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # None of these crates depends on Tauri, so no WebKitGTK or other system packages.
      - run: cargo test -p iptv-core -p iptv-server -p iptv-mock
