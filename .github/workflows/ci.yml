# The same checks as `pnpm check`, plus the production build and its entry-chunk budget.
# The desktop crate (iptv-tauri) builds on Windows and macOS, so the full Rust pass runs on both;
# Linux tests the crates that do not depend on Tauri. No secrets are used.
#
# Every push and pull request: frontend, rust-windows, rust-linux and cargo-deny.
# Pull requests and pushes to master also run the slower jobs: msrv (cargo check with the
# rust-version from Cargo.toml), docker (builds and starts the server image, no push),
# tauri-build (the Windows release build without the installer) and macos (clippy, tests and
# the universal disk image, uploaded as an artifact).
# Playwright runs in e2e.yml; releases are built by release.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  frontend:
    name: Frontend (typecheck, test, build, size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm comes from corepack, at the version package.json pins (packageManager).
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size:check

  rust-windows:
    name: Rust on Windows (fmt, clippy, test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs build.frontendDist (../../dist) to exist. The Rust checks
      # do not need the real UI, so a placeholder page stands in for `pnpm build`.
      - name: Placeholder frontend for iptv-tauri
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>Tsrust IPTV</title>' > dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-linux:
    name: Rust on Linux (core, server, mock)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # None of these crates depends on Tauri, so no WebKitGTK or other system packages.
      - run: cargo test -p iptv-core -p iptv-server -p iptv-mock

  # Advisories, licences, banned crates and sources, configured in deny.toml. A new advisory can
  # appear any day without a change here, so that leg reports without failing the workflow; the
  # licence, ban and source checks must pass.
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: ${{ matrix.checks }}
          # Replaces the action's default --all-features: deny.toml checks the default
          # features, which is what ships (the updater feature is off).
          arguments: --workspace

  # Cargo.toml's rust-version is the oldest Rust this workspace claims to build with. This job
  # holds it to that: it checks every crate, the Tauri one included, with exactly that toolchain.
  msrv:
    name: Rust MSRV (cargo check on Windows)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::No rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # rust-toolchain.toml selects stable; this makes cargo and the cache key use the MSRV.
      - name: Use the MSRV toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.msrv.outputs.version }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Placeholder frontend for iptv-tauri
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>Tsrust IPTV</title>' > dist/index.html
      - run: cargo check --workspace --all-targets --locked

  docker:
    name: Docker image (build and start, no push)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The cache scope matches the amd64 leg of release.yml, so a release reuses these layers.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tsrust-iptv:ci
          cache-from: type=gha,scope=server-linux-amd64
          cache-to: type=gha,mode=max,scope=server-linux-amd64
      - name: Start the image and wait for /api/health
        run: |
          docker run -d --name tsrust -p 127.0.0.1:7180:7180 tsrust-iptv:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7180/api/health; then
              echo
              docker inspect --format '{{ json .Config.Labels }}' tsrust-iptv:ci
              exit 0
            fi
            sleep 2
          done
          docker logs tsrust
          exit 1

  # The release build of the desktop app as `pnpm tauri build` makes it (beforeBuildCommand runs
  # pnpm build, the real dist/ is embedded), without the NSIS step. release.yml bundles it.
  tauri-build:
    name: Desktop release build (no installer)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm tauri build --no-bundle

  # The macOS desktop app: clippy and the workspace tests (Apple silicon only; the Intel half is
  # built but never run), then the universal disk image as release.yml builds it
  # (tauri.macos.conf.json merged in, ad-hoc signed). The disk image is uploaded as the macos-dmg
  # artifact, so a build can be tried on a Mac before a tag.
  macos:
    name: macOS (clippy, test, disk image)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs dist/; the bundle step below builds it again.
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm tauri build --target universal-apple-darwin
      # What a Mac user gets from the disk image: both architectures, a valid ad-hoc signature,
      # macOS 11 as the minimum, App Transport Security off (Info.plist), and the licences.
      - name: Check the app in the disk image
        run: |
          set -euo pipefail
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          mkdir -p "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          app=$(ls -d "$RUNNER_TEMP"/dmg/*.app)
          plist="$app/Contents/Info.plist"
          exe="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")"
          lipo -archs "$exe"
          lipo "$exe" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 "$app"
          signature=$(codesign -dv "$app" 2>&1)
          grep -q 'Signature=adhoc' <<< "$signature"
          test "$(plutil -extract LSMinimumSystemVersion raw "$plist")" = 11.0
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$plist")" = true
          ls -l "$app/Contents/Resources/LICENSE" "$app/Contents/Resources/NOTICE"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
