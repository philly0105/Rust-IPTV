# Playwright end-to-end tests: the web UI in server mode against iptv-mock's sample Xtream,
# Stalker, M3U and XMLTV sources. playwright.config.ts starts iptv-mock (port 7290) and
# iptv-server (port 7180, fresh ./.e2e-data) with `cargo run`, and needs dist/ from pnpm build.
#
# Browser: Microsoft Edge (PW_CHANNEL=msedge, the config's default). The mock's movies and HLS
# segments are H.264 with AAC, which Playwright's bundled Chromium cannot play, so a
# PW_CHANNEL=chromium run fails every spec that plays media. GitHub's Ubuntu image ships Edge.
#
# Runs on pull requests, every Monday (catches browser updates), and by hand.
name: E2E

on:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  playwright:
    name: Playwright (Edge, server mode)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Built one at a time, the way the config's `cargo run -p ...` builds them, so those
      # commands only start the binaries and stay inside the config's web-server timeout.
      - name: Build iptv-mock and iptv-server
        run: |
          cargo build -p iptv-mock
          cargo build -p iptv-server
      - run: pnpm build

      # Edge is normally on the runner image; install it only if the image ever drops it.
      # Playwright's ffmpeg build records the videos of failed tests.
      - name: Browser and video recorder
        run: |
          if [ ! -x /opt/microsoft/msedge/msedge ]; then
            pnpm exec playwright install --with-deps msedge
          fi
          pnpm exec playwright install ffmpeg

      - run: pnpm e2e
        env:
          PW_CHANNEL: msedge

      # e2e/screens.spec.ts saves the main screens (desktop and phone, dark, light and OLED)
      # for review.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: test-results/screens/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
