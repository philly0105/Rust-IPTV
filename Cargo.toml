[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["philly"]

[workspace.dependencies]
# Internal crates
iptv-core = { path = "crates/iptv-core" }
iptv-mock = { path = "crates/iptv-mock" }
iptv-fixtures = { path = "crates/iptv-fixtures" }

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
# recording: native reminder notifications
tauri-plugin-notification = "2"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Async / net
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
axum = { version = "0.8", features = ["ws", "macros"] }
# compression-*: gzip/brotli for server-mode RPC replies and the built UI.
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "compression-br"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
async-trait = "0.1"
url = "2"
percent-encoding = "2"

# Serialization / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
flate2 = "1"
memchr = "2"
regex = "1"
base64 = "0.22"
# imagecache: downscaled poster/logo variants (JPEG and PNG only).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hex = "0.4"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dirs = "6"
rand = "0.8"
memory-stats = "1"
tempfile = "3"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
strsim = "0.11"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
# remote: LAN remote control (interface addresses, pairing QR code)
if-addrs = "0.15"
qrcodegen = "1.8"

# Windows (iptv-tauri, cfg windows)
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

# The bundled SQLite is C code built by the cc crate, which follows the
# profile's opt-level: "s" compiles it for size (/O1 with MSVC). Every catalog
# query runs in it, so it gets full optimization.
[profile.release.package.libsqlite3-sys]
opt-level = 3

# The crates that do the CPU work of imports, guides, JSON replies and poster
# variants also build at opt-level 3; the rest stays at "s". Measured on Linux
# (iptv-server, fat LTO, 2026-11-09, CPU time of the release perf tests,
# median of 7 interleaved runs on a busy 4-core box):
#
# | Build                        | iptv-server | xz -9    | image_resize | epg_perf | catalog_perf | m3u_perf |
# | ---------------------------- | ----------- | -------- | ------------ | -------- | ------------ | -------- |
# | all "s"                      | 18.43 MB    | 6.23 MB  | 1.23 s       | 1.89 s   | 12.02 s      | 1.53 s   |
# | "s" + these crates at 3      | 21.08 MB    | 6.97 MB  | 1.06 s       | 1.77 s   | 11.23 s      | 1.48 s   |
# | everything at 3              | 24.25 MB    | 7.67 MB  | 1.03 s       | 1.73 s   | 11.09 s      | 1.49 s   |
#
# Resizing a 512 px PNG logo to 192 px took 8.4 ms at "s" and 4.6 ms with
# these crates at 3 (a 600x900 JPEG poster 16.5 to 13.3 ms, a 2000x3000
# original 74 to 60 ms). These crates give nearly all of opt-level 3's gain
# for half its size cost. Wall-clock times on that box swung by up to 2x
# between runs, so only the CPU times above were used.
[profile.release.package.iptv-core]
opt-level = 3
[profile.release.package.serde_json]
opt-level = 3
[profile.release.package.quick-xml]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.zlib-rs]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3

# Debug builds keep line tables for our crates (readable backtraces) and no
# debug info for dependencies. Full PDBs for every test binary filled tens of GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
