[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["philly"]

[workspace.dependencies]
# Internal crates
iptv-core = { path = "crates/iptv-core" }
iptv-mock = { path = "crates/iptv-mock" }
iptv-fixtures = { path = "crates/iptv-fixtures" }

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
# recording: native reminder notifications
tauri-plugin-notification = "2"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Async / net
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
axum = { version = "0.8", features = ["ws", "macros"] }
# compression-*: gzip/brotli for server-mode RPC replies and the built UI.
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "compression-br"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
async-trait = "0.1"
url = "2"
percent-encoding = "2"

# Serialization / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
flate2 = "1"
memchr = "2"
regex = "1"
base64 = "0.22"
# imagecache: downscaled poster/logo variants (JPEG and PNG only).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hex = "0.4"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
dirs = "6"
rand = "0.8"
memory-stats = "1"
tempfile = "3"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
strsim = "0.11"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
# remote: LAN remote control (interface addresses, pairing QR code)
if-addrs = "0.15"
qrcodegen = "1.8"

# Windows (iptv-tauri, cfg windows)
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
# "s", measured against 2 and 3 with this profile on the iptv-core release
# perf tests and tests/resize_perf.rs (4-core Linux, 2026-10-31): 2 made a
# poster resize, a 120 MB guide ingest and the 50k-entry M3U parse 8-24%
# faster, imports about 5% and searches and page queries no faster (they run
# in SQLite, already at 3 below); 3 was no better overall. Either level grew
# iptv-server by 32% (18.5 to 24.4 MB). Under fat LTO the merged module is
# optimized at the binary crate's level, so a package override that raises
# one Rust crate above it (iptv-core, image or serde_json at 2 or 3 under
# this "s") changes next to nothing: only this level does. The reverse does
# hold: an "s" crate under a 2 or 3 root keeps its size attribute.
opt-level = "s"
panic = "unwind"
strip = true

# The bundled SQLite is C code built by the cc crate, which follows the
# profile's opt-level: "s" compiles it for size (/O1 with MSVC). Every catalog
# query runs in it, so it gets full optimization. Unlike a Rust crate's, this
# override survives LTO: cc builds native objects outside it.
[profile.release.package.libsqlite3-sys]
opt-level = 3

# Debug builds keep line tables for our crates (readable backtraces) and no
# debug info for dependencies. Full PDBs for every test binary filled tens of GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
