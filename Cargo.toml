[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["philly"]

[workspace.dependencies]
# Internal crates
iptv-core = { path = "crates/iptv-core" }
iptv-mock = { path = "crates/iptv-mock" }
iptv-fixtures = { path = "crates/iptv-fixtures" }

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Async / net
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
async-trait = "0.1"
url = "2"
percent-encoding = "2"

# Serialization / parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
flate2 = "1"
memchr = "2"
regex = "1"
base64 = "0.22"
hex = "0.4"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md5 = "0.7"
dirs = "6"
rand = "0.8"
memory-stats = "1"
tempfile = "3"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
strsim = "0.11"
clap = { version = "4", features = ["derive", "env"] }

# Windows (iptv-tauri, cfg windows)
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 1
