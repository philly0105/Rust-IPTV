# cargo-about configuration for the Rust part of THIRD_PARTY_NOTICES.md.
# tools/third-party-notices.mjs explains the whole flow. The release workflow runs:
#
#   cargo about generate --locked --fail --output-file target/notices-rust.md about.hbs
#
# Keep `accepted` in step with [licenses] allow in deny.toml, which CI enforces.
# Order matters: for a crate offered under a choice of licences (MIT OR
# Apache-2.0), cargo-about uses the first one listed here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "MIT-0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# The same platforms as deny.toml: Windows for the desktop app, Linux amd64 and
# arm64 for the server image.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# Build scripts and test-only crates are not part of the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace's own crates are not third-party software.
private = { ignore = true }
