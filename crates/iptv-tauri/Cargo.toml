[package]
name = "iptv-tauri"
description = "Tsrust IPTV desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "iptv-tauri"

[lib]
name = "iptv_tauri_lib"
crate-type = ["rlib"]

[[bin]]
name = "iptv-tauri"
path = "src/main.rs"

[features]
default = []
# Auto-update. Off by default: tauri-plugin-updater refuses to start without a
# signing pubkey and endpoint in tauri.conf.json (plugins.updater). See the
# `// I: updater` note in src/lib.rs before enabling.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
iptv-core = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-updater = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
