<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <!-- Full-bleed, opaque version of mark.svg for Android maskable icons and the iOS home screen,
       which crop to their own shape. The glyph is scaled to 86 % so it stays inside the central
       80 % circle every launcher mask keeps. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d283b"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="backlight" cx="33.7" cy="32" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5b544" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f5b544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="16" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc964"/>
      <stop offset="1" stop-color="#e3972a"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="22.5" x2="0" y2="37.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4da"/>
      <stop offset=".5" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f5b544"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(34 30) scale(6.5 13)">
      <stop offset="0" stop-color="#ffc55a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffc55a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="20" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="64" height="64" fill="url(#tile)"/>
  <rect width="64" height="64" fill="url(#backlight)"/>
  <g transform="translate(32 32) scale(.86) translate(-32 -30)">
    <rect x="14" y="20" width="36" height="24" rx="5" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="4" filter="url(#lift)"/>
    <rect x="14" y="18" width="36" height="24" rx="5" fill="#05080e" fill-opacity=".6" stroke="url(#frame)" stroke-width="4"/>
    <rect x="16" y="20" width="32" height="20" rx="3" fill="url(#sheen)"/>
    <path d="M18 35h28" fill="none" stroke="#f5b544" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M18 35v-4m4 4v-2m4 2v-4m4 4v-2m8 2v-2m4 2v-4m4 4v-2" fill="none" stroke="#f5b544" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="34" cy="30" rx="6.5" ry="13" fill="url(#glow)"/>
    <rect x="32.25" y="22.5" width="3.5" height="15" rx="1.75" fill="url(#needle)"/>
  </g>
</svg>
