<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Watch your M3U playlists, Xtream accounts and Stalker portals with a full TV guide." />
    <meta name="application-name" content="Tsrust IPTV" />
    <meta name="apple-mobile-web-app-title" content="Tsrust IPTV" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- One per OS scheme for browsers that run no script; theme-boot.js writes the app's own theme into both. -->
    <meta name="theme-color" content="#0c1320" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#edf0f5" media="(prefers-color-scheme: light)" />
    <!-- Blocking on purpose: sets the saved theme before the first paint (after the theme-color metas it updates). -->
    <script src="/theme-boot.js"></script>
    <title>Tsrust IPTV</title>
  </head>
  <body>
    <div id="root">
      <!--
        Boot splash, painted with the first frame in the theme theme-boot.js set (the colours are the
        tokens). React replaces it on its first render. Styles stay in attributes: Tauri adds a nonce
        to style-src for any <style> element, and a nonce turns off 'unsafe-inline' for every style
        attribute in the app.
      -->
      <div
        data-boot-splash
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: var(--color-bg, #0c1320); color: var(--color-fg-muted, #a9b3c6); font-family: var(--font-display, Bahnschrift, 'Segoe UI', system-ui, sans-serif); font-size: 20px; font-weight: 600; letter-spacing: 0.04em"
      >
        <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="boot-tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#1d283b"/>
              <stop offset=".5" stop-color="#111827"/>
              <stop offset="1" stop-color="#0a0e17"/>
            </linearGradient>
            <radialGradient id="boot-backlight" cx="34" cy="30" r="26" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#f5b544" stop-opacity=".2"/>
              <stop offset="1" stop-color="#f5b544" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="boot-rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
              <stop offset=".3" stop-color="#fff" stop-opacity=".05"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="boot-frame" x1="0" y1="16" x2="0" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffc964"/>
              <stop offset="1" stop-color="#e3972a"/>
            </linearGradient>
            <linearGradient id="boot-needle" x1="0" y1="22.5" x2="0" y2="37.5" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff4da"/>
              <stop offset=".5" stop-color="#ffd27a"/>
              <stop offset="1" stop-color="#f5b544"/>
            </linearGradient>
            <radialGradient id="boot-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(34 30) scale(6.5 13)">
              <stop offset="0" stop-color="#ffc55a" stop-opacity=".6"/>
              <stop offset="1" stop-color="#ffc55a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="boot-sheen" x1="0" y1="20" x2="0" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
              <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <filter id="boot-lift" x="-20%" y="-20%" width="140%" height="160%">
              <feGaussianBlur stdDeviation="1.6"/>
            </filter>
          </defs>
          <rect width="64" height="64" rx="14" fill="url(#boot-tile)"/>
          <rect width="64" height="64" rx="14" fill="url(#boot-backlight)"/>
          <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="url(#boot-rim)"/>
          <rect x="14" y="20" width="36" height="24" rx="5" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="4" filter="url(#boot-lift)"/>
          <rect x="14" y="18" width="36" height="24" rx="5" fill="#05080e" fill-opacity=".6" stroke="url(#boot-frame)" stroke-width="4"/>
          <rect x="16" y="20" width="32" height="20" rx="3" fill="url(#boot-sheen)"/>
          <path d="M18 35h28" fill="none" stroke="#f5b544" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M18 35v-4m4 4v-2m4 2v-4m4 4v-2m8 2v-2m4 2v-4m4 4v-2" fill="none" stroke="#f5b544" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
          <ellipse cx="34" cy="30" rx="6.5" ry="13" fill="url(#boot-glow)"/>
          <rect x="32.25" y="22.5" width="3.5" height="15" rx="1.75" fill="url(#boot-needle)"/>
        </svg>
        <span>Tsrust IPTV</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
